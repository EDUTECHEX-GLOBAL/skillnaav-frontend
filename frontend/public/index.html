<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- ✅ SEO Meta Tags -->
    <title>Skill Naav - Navigate Your Skills</title>
    <meta
      name="description"
      content="Skill Naav helps students and professionals navigate their skills through internships, job opportunities, and training programs."
    />
    <meta name="keywords" content="Skill Naav, internships, jobs, career, training, skill development" />
    <meta name="author" content="Skill Naav Team" />

    <!-- ✅ Social Media Preview (Open Graph / Twitter) -->
    <meta property="og:title" content="Skill Naav - Navigate Your Skills" />
    <meta property="og:description" content="Navigate your skills with internships, jobs, and training." />
    <meta property="og:image" content="%PUBLIC_URL%/logo192.png" />
    <meta property="og:url" content="https://skillnaav.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css"
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Skill Naav",
      "url": "https://skillnaav.com",
      "logo": "https://skillnaav.com/logo192.png",
      "sameAs": [
        "https://www.linkedin.com/company/skillnaav",
        "https://twitter.com/skillnaav"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "support@skillnaav.com"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://skillnaav.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://skillnaav.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
