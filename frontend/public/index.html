<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-512x512.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="Skill Naav — Navigate Your Skills. Discover internships, assign instructors, and manage schedules." />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Add this in your public/index.html head section -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css" />

  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>Skill Naav- Navigate Your Skills</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Open Graph (WhatsApp/LinkedIn/Facebook) -->
  <meta property="og:title" content="Skill Naav — Navigate Your Skills" />
  <meta property="og:description"
    content="Discover internships, assign instructors, and manage schedules — all in one place." />
  <meta property="og:type" content="website" />

  <!-- IMPORTANT: match the exact URL you actually share (your screenshot shows apex domain) -->
  <link rel="canonical" href="https://skillnaav.com/" />
  <meta property="og:url" content="https://skillnaav.com/" />

  <!-- Image: absolute HTTPS URL, 1200×630 recommended -->
  <meta property="og:image" content="https://www.skillnaav.com/skillnaav-og.png" />
  <meta property="og:image:secure_url" content="https://www.skillnaav.com/skillnaav-og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Skill Naav logo" />
  <meta property="og:site_name" content="Skill Naav" />

  <!-- Twitter (kept simple; WhatsApp uses OG above) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Skill Naav — Navigate Your Skills" />
  <meta name="twitter:description"
    content="Discover internships, assign instructors, and manage schedules — all in one place." />
  <meta name="twitter:image" content="https://www.skillnaav.com/skillnaav-og.png" />

  <!-- iOS home-screen icon (uses your single PNG). Omit sizes since it’s not square -->
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-512x512.png">

</head>
